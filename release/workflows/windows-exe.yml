name: Build Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run verification tests
        run: npm test
      - name: Windows Win32 helper smoke test
        shell: pwsh
        run: |
          # Exercise the actual script in a real Windows runner without touching a browser.
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\src\ops\windowControl.ps1" -Mode focus -Pids "$PID"
          if ($LASTEXITCODE -ne 0) { throw "Window manager helper failed to execute" }
          $result = $output | ConvertFrom-Json
          if ($result.mode -ne 'focus' -or @($result.results).Count -ne 1) {
            throw "Window manager helper produced invalid response"
          }
      - name: Smoke real Chrome or Edge profile and active tab
        run: node test/real-chromium-smoke.js
      - name: Build Windows installer
        run: npm run build:win
      - name: Verify packaged Win32 helper is unpacked
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\win-unpacked\resources\app.asar.unpacked\src\ops\windowControl.ps1")) {
            throw "PowerShell helper missing from Electron unpacked bundle"
          }
      - name: Verify external bundled engine staging
        shell: pwsh
        run: |
          $resources = ".\\dist\\win-unpacked\\resources\\lhm-engines"
          if (-not (Test-Path (Join-Path $resources "README.md"))) {
            throw "External bundled browser resources missing from packaged installer"
          }
          if (Test-Path ".\\dist\\win-unpacked\\resources\\app.asar.unpacked\\resources\\bundled-engines") {
            throw "Bundled engine resources unexpectedly duplicated inside app bundle"
          }
          if (-not (Test-Path ".\\dist\\win-unpacked\\resources\\lhm-camoufox\\README.md")) {
            throw "Camoufox external release staging directory missing"
          }
          if (Test-Path ".\\dist\\win-unpacked\\resources\\app.asar.unpacked\\resources\\camoufox-engine") {
            throw "Camoufox resource folder was packed inside app bundle unexpectedly"
          }
          $extractor = Join-Path $PWD "dist/win-unpacked/resources/app.asar.unpacked/tools/extract-signed-engine.ps1"
          if (-not (Test-Path $extractor)) {
            throw "Signed extraction helper missing from unpacked Electron resources"
          }
          $camoufoxStaging = Join-Path $PWD "dist/win-unpacked/resources/lhm-camoufox"
          foreach ($unsafe in @("camoufox.exe", "release.json", "publisher-ed25519.pub")) {
            if (Test-Path (Join-Path $camoufoxStaging $unsafe)) {
              throw "Draft preview unexpectedly contains unapproved Camoufox commercial asset: $unsafe"
            }
          }
          node -e "const m=require('./src/engine/bundledEngineManager'); if(typeof m.BundledEngineManager!=='function')process.exit(1)"
      - name: Capture actual Electron UI (sample data)
        shell: pwsh
        env:
          LHM_CI_UI_CAPTURE: '1'
        run: |
          $proc = Start-Process -FilePath ".\node_modules\electron\dist\electron.exe" -ArgumentList "." -PassThru
          try {
            if (-not $proc.WaitForExit(45000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Electron UI capture timed out"
            }
            foreach ($screen in @("workspace-preview.png", "workspace-expanded-preview.png", "workspace-command-preview.png", "workspace-engine-provider-preview.png")) {
              if (-not (Test-Path ("dist\" + $screen))) { throw "Missing actual Electron screenshot: $screen" }
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Upload actual Electron UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Workspace-UI-Preview
          path: dist/workspace-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
