name: Cloudflare credential audit (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cloudflare-credential-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lhm-cloudflare-credential-audit
  cancel-in-progress: false
jobs:
  verify-scopes:
    # Runs exclusively from reviewed main; no PR-supplied code or checkout.
    # Revalidated 2026-10-27: probe account-token and user-token verification without exposing secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      LHM_D1_DATABASE_ID: ${{ secrets.LHM_D1_DATABASE_ID }}
    steps:
      - name: Validate secret presence without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing Cloudflare API token or account ID secret"
            exit 1
          fi
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || {
            echo "::error::Cloudflare Account ID must be 32 hexadecimal characters"; exit 1;
          }
          echo "Cloudflare token and account ID are configured (values withheld)"
      - name: Read-only Cloudflare token and resource access probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guard"
          cloudflare_api() {
            local endpoint="$1" out="$2"
            curl --silent --show-error --fail-with-body \
              --connect-timeout 8 --max-time 20 --retry 2 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" \
              -o "$out" "$endpoint"
          }
          # Account-owned tokens use /accounts/{id}/tokens/verify rather
          # than /user/tokens/verify. Never print body/credential values.
          cloudflare_status() {
            local endpoint="$1" out="$2"
            curl --silent --show-error --connect-timeout 8 --max-time 20               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Accept: application/json"               -o "$out" -w '%{http_code}' "$endpoint"
          }
          export USER_VERIFY_HTTP
          export ACCOUNT_VERIFY_HTTP
          export WORKERS_READ_HTTP
          export D1_READ_HTTP
          USER_VERIFY_HTTP=$(cloudflare_status "https://api.cloudflare.com/client/v4/user/tokens/verify" "$RUNNER_TEMP/guard/user-token.json")
          ACCOUNT_VERIFY_HTTP=$(cloudflare_status "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" "$RUNNER_TEMP/guard/account-token.json")
          WORKERS_READ_HTTP=$(cloudflare_status "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "$RUNNER_TEMP/guard/workers.json")
          D1_READ_HTTP=$(cloudflare_status "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=1" "$RUNNER_TEMP/guard/d1.json")
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=path.join(process.env.RUNNER_TEMP,'guard');
          const read=(file)=>{try{return JSON.parse(fs.readFileSync(path.join(root,file),'utf8'));}
            catch(_){return null;}};
          const good=(key,file,active=false)=>{
            const obj=read(file);
            return process.env[key]==='200'&&obj?.success===true&&
              (!active||obj.result?.status==='active');
          };
          const user=good('USER_VERIFY_HTTP','user-token.json',true);
          const account=good('ACCOUNT_VERIFY_HTTP','account-token.json',true);
          const workers=good('WORKERS_READ_HTTP','workers.json');
          const d1=good('D1_READ_HTTP','d1.json');
          console.log('User token verification: '+(user?'PASS':'NOT_CONFIRMED')+
            ' (HTTP '+process.env.USER_VERIFY_HTTP+')');
          console.log('Account token verification: '+(account?'PASS':'NOT_CONFIRMED')+
            ' (HTTP '+process.env.ACCOUNT_VERIFY_HTTP+')');
          console.log('Workers script list: '+(workers?'PASS':'NOT_CONFIRMED')+
            ' (HTTP '+process.env.WORKERS_READ_HTTP+')');
          console.log('D1 database list: '+(d1?'PASS':'NOT_CONFIRMED')+
            ' (HTTP '+process.env.D1_READ_HTTP+')');
          if(!user&&!account)throw Error('CLOUDFLARE_TOKEN_NOT_AUTHENTICATED');
          if(!workers||!d1)throw Error('CLOUDFLARE_RESOURCE_READ_PERMISSION_MISSING');
          console.log('PASS: real Cloudflare token active, Workers read and D1 list access');
          NODE
          {
            echo '### Cloudflare credential audit (read only)'
            echo '- Token active: PASS'
            echo '- Workers API readable: PASS'
            echo '- D1 list API readable: PASS'
            echo '- Worker/D1/DNS creation permission: NOT TESTED'
            echo '- No deployment, DNS mutation, billing, secrets readout or migration'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout read-only inventory script from reviewed main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect isolated staging resources and DNS (NO WRITES)
        shell: bash
        run: node tools/cloudflare-staging-inventory-readonly.mjs
      - name: Delete temporary Cloudflare responses
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/guard"
