name: Cloudflare credential audit (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cloudflare-credential-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lhm-cloudflare-credential-audit
  cancel-in-progress: false
jobs:
  verify-scopes:
    # Runs exclusively from reviewed main; no PR-supplied code or checkout.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LHM_D1_DATABASE_ID: ${{ secrets.LHM_D1_DATABASE_ID }}
    steps:
      - name: Validate secret presence without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing Cloudflare API token or account ID secret"
            exit 1
          fi
          echo "Cloudflare token and account ID are configured (values withheld)"
      - name: Read-only Cloudflare token and resource access probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guard"
          cloudflare_api() {
            local endpoint="$1" out="$2"
            curl --silent --show-error --fail-with-body \
              --connect-timeout 8 --max-time 20 --retry 2 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" \
              -o "$out" "$endpoint"
          }
          cloudflare_api "https://api.cloudflare.com/client/v4/user/tokens/verify" "$RUNNER_TEMP/guard/token.json"
          cloudflare_api "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" "$RUNNER_TEMP/guard/workers.json"
          cloudflare_api "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=1" "$RUNNER_TEMP/guard/d1.json"
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir=path.join(process.env.RUNNER_TEMP,'guard');
          for(const filename of ['token.json','workers.json','d1.json']){
            const obj=JSON.parse(fs.readFileSync(path.join(dir,filename),'utf8'));
            if(obj.success!==true)throw Error(filename+' Cloudflare access failed');
            if(filename==='token.json'&&obj.result?.status!=='active')
              throw Error('Cloudflare token is not active');
          }
          console.log('PASS: real Cloudflare token active, Workers read and D1 list access');
          NODE
          {
            echo '### Cloudflare credential audit (read only)'
            echo '- Token active: PASS'
            echo '- Workers API readable: PASS'
            echo '- D1 list API readable: PASS'
            echo '- Worker/D1/DNS creation permission: NOT TESTED'
            echo '- No deployment, DNS mutation, billing, secrets readout or migration'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete temporary Cloudflare responses
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/guard"
