name: Deploy LHM License Center to Cloudflare (manual)
on:
  workflow_dispatch:
    inputs:
      hostname_confirmation:
        description: 'Type browser.lhmcrm.com after verifying the existing DNS record and Cloudflare zone'
        required: true
        type: string
      migration_confirmation:
        description: 'Type BACKUP_AND_MIGRATIONS_REVIEWED after backing up D1 and reviewing SQL'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: lhm-license-center-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      HOSTNAME_CONFIRMATION: ${{ inputs.hostname_confirmation }}
      MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Explicit production guard and Cloudflare prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LHM_D1_DATABASE_ID: ${{ secrets.LHM_D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HOSTNAME_CONFIRMATION" = 'browser.lhmcrm.com' || { echo 'Hostname not confirmed'; exit 1; }
          test "$MIGRATION_CONFIRMATION" = 'BACKUP_AND_MIGRATIONS_REVIEWED' || { echo 'D1 backup and SQL review not confirmed'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          node - <<'NODE'
          const fs=require('node:fs');
          const id=process.env.LHM_D1_DATABASE_ID||'';
          if(!/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i.test(id)){
            throw Error('Missing/invalid LHM_D1_DATABASE_ID');
          }
          const source=fs.readFileSync('serverless/license-worker/wrangler.toml.example','utf8');
          if(!source.includes('REPLACE_WITH_D1_DATABASE_UUID')||
            !source.includes('pattern = "browser.lhmcrm.com"')||
            !source.includes('workers_dev = false'))throw Error('Unsafe Wrangler template');
          fs.writeFileSync('serverless/license-worker/wrangler.toml',
            source.replace('REPLACE_WITH_D1_DATABASE_UUID',id),{mode:0o600});
          NODE
      - name: Test license Worker and payment portal
        run: |
          npm ci
          node test/license-cloudflare-worker.js
          node test/license-admin-portal.js
      - name: Check owner-provisioned Cloudflare Worker secrets (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        working-directory: serverless/license-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.46.0 secret list --format json > worker-secrets-names.json
          node - <<'NODE'
          const fs=require('node:fs');
          const vars=JSON.parse(fs.readFileSync('worker-secrets-names.json','utf8'));
          if(!Array.isArray(vars))throw Error('Unexpected Wrangler secret-list format');
          const have=new Set(vars.map(x=>x.name));
          const required=['LHM_ISSUER_PRIVATE_PKCS8_B64','LHM_ISSUER_PUBLIC_SPKI_B64',
            'LHM_LICENSE_ADMIN_TOKEN','LHM_ORDER_TOKEN_ENC_KEY_B64'];
          const missing=required.filter(x=>!have.has(x));
          if(missing.length)throw Error('Missing owner-provisioned Worker secrets: '+missing.join(', '));
          console.log('Four required Worker secret names present; secret values are never accessed');
          NODE
          rm worker-secrets-names.json
      - name: Apply reviewed remote D1 migrations (Cloudflare creates backup)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: serverless/license-worker
        run: npx --yes wrangler@4.46.0 d1 migrations apply lhm-license-db --remote
      - name: Deploy to owner-confirmed Custom Domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: serverless/license-worker
        run: npx --yes wrangler@4.46.0 deploy
      - name: Read-only HTTPS, D1 and admin authentication smoke
        run: node tools/browser-production-smoke.js https://browser.lhmcrm.com
      - name: Record deployment provenance without credentials
        run: |
          echo "### LHM Browser License Center" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare hostname: https://browser.lhmcrm.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 migration applied; read-only HTTPS smoke passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Payment settlement and independent Windows activation: NOT VERIFIED BY THIS WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
