name: Regenerate lockfile for reviewed dependency security patch
on:
  push:
    branches: [feature/google-commerce-control-plane-20261025]
    paths:
      - package.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lhm-reviewed-package-lock-remediation
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'capquangfptminhlh/ggminh' && github.ref == 'refs/heads/feature/google-commerce-control-plane-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build deterministic lockfile for reviewed package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm exact audited versions and parser syntax
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for(const key of ['electron','electron-builder']){
            const requested=pkg.devDependencies[key];
            if(!/^\d+\.\d+\.\d+$/.test(requested))
              throw Error(key+' version must be explicitly pinned');
            const actual=lock.packages['node_modules/'+key]?.version;
            if(actual!==requested)throw Error(key+' lockfile does not match package.json');
            console.log(key+' '+actual+' locked');
          }
          JS
          node --check main.js
          node --check preload.js
      - name: Save ONLY the lockfile; do not touch release branches
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already matches'; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git diff --cached --name-only | grep -Fxq 'package-lock.json'
          git commit -m 'chore(security): refresh pinned Electron and electron-builder lockfile'
          git push origin HEAD:feature/google-commerce-control-plane-20261025
