name: Cloudflare staging credential name discovery (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-staging-secret-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-staging-secret-discovery
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      EXACT_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      ALIAS_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
      ALIAS_CF_TOKEN: ${{ secrets.CF_TOKEN != '' }}
      ALIAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN != '' }}
      EXACT_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      ALIAS_CF_ACCOUNT_SECRET: ${{ secrets.CF_ACCOUNT_ID != '' }}
      EXACT_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
      ALIAS_CF_ACCOUNT_VAR: ${{ vars.CF_ACCOUNT_ID != '' }}
      EXACT_D1_SECRET: ${{ secrets.LHM_D1_DATABASE_ID != '' }}
      EXACT_D1_VAR: ${{ vars.LHM_D1_DATABASE_ID != '' }}
    steps:
      - name: Report presence ONLY without exposing any credential content
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Cloudflare secret-name discovery · staging'
            echo 'Checked GitHub Actions merged repository / staging secret and variable names.'
            echo 'The values of all credentials are never loaded into this runner.'
            echo '| Expected / alternate name | Present |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for key in EXACT_API_TOKEN ALIAS_CF_API_TOKEN ALIAS_CF_TOKEN \
            ALIAS_CLOUDFLARE_TOKEN EXACT_ACCOUNT_SECRET ALIAS_CF_ACCOUNT_SECRET \
            EXACT_ACCOUNT_VAR ALIAS_CF_ACCOUNT_VAR EXACT_D1_SECRET EXACT_D1_VAR; do
            value="${!key}"
            if [[ "$value" != true && "$value" != false ]]; then
              echo "::error::Invalid boolean metadata"; exit 1
            fi
            printf '| %s | %s |\n' "$key" "$value" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ "$EXACT_API_TOKEN" == true && \
            ( "$EXACT_ACCOUNT_SECRET" == true || "$EXACT_ACCOUNT_VAR" == true ) ]]; then
            echo 'PASS: primary Cloudflare staging names exist. Authentication and API scopes NOT tested.'
          else
            echo 'DIAGNOSTIC: exact workflow names still unavailable; inspect summary for aliases.'
          fi
