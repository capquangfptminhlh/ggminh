name: Pinned Camoufox packaged synthetic acceptance (no release)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  packaged-pinned-local:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download exact app installer
        uses: actions/download-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          run-id: '44904533507'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lhm-pinned-installer
      - name: Download exact build evidence
        uses: actions/download-artifact@v4
        with:
          name: LHM-Release-Evidence-Windows
          run-id: '44904533507'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lhm-pinned-evidence
      - name: Download engine test artifact
        uses: actions/download-artifact@v4
        with:
          name: camoufox-156.0.1-beta.36-win.x86_64-lhm-lsflush-UNVERIFIED
          run-id: '44736873136'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lhm-pinned-source
      - name: Verify artifacts and install into runner temp
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=@(Get-ChildItem "$env:RUNNER_TEMP/lhm-pinned-installer" -Filter '*.exe' -File)
          $evidence=@(Get-ChildItem "$env:RUNNER_TEMP/lhm-pinned-evidence" -Filter 'release-evidence.json' -File)
          $zip=@(Get-ChildItem "$env:RUNNER_TEMP/lhm-pinned-source" -Filter '*.zip' -File)
          if($installer.Count -ne 1 -or $evidence.Count -ne 1 -or $zip.Count -ne 1){throw 'Expected exactly one file per artifact'}
          node tools/windows-clean-install-evidence.js verify-build --installer $installer[0].FullName --evidence $evidence[0].FullName --commit 9d5327ab24dd672728c63a3a6687184b00325c0b --run-id 44904533507
          if($LASTEXITCODE -ne 0){throw 'Installer provenance failed'}
          if((Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c0837412fa7c1943c21806d9949994384603be7bf07a6630375190171d23eeee'){throw 'Engine archive digest mismatch'}
          $install=Join-Path $env:RUNNER_TEMP 'lhm-pinned-app'
          $p=Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S',('/D='+$install)) -PassThru -Wait -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw 'Synthetic installation failed'}
          "LHM_PACKAGED_EXE=$install\LHM Ads Browser.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LHM_PINNED_ENGINE=$($zip[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise import, create, open and reopen after app restart
        shell: pwsh
        run: |
          node tools/test-pinned-packaged-ui.js
          if($LASTEXITCODE -ne 0){throw 'Packaged synthetic Camoufox acceptance failed'}
  synthetic-upgrade:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download baseline installer
        uses: actions/download-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          run-id: '43921502417'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/upgrade/baseline
      - name: Download baseline evidence
        uses: actions/download-artifact@v4
        with:
          name: LHM-Release-Evidence-Windows
          run-id: '43921502417'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/upgrade/baseline-evidence
      - name: Download candidate installer
        uses: actions/download-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          run-id: '44904533507'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/upgrade/candidate
      - name: Download candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: LHM-Release-Evidence-Windows
          run-id: '44904533507'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/upgrade/candidate-evidence
      - name: Verify inputs and exercise synthetic upgrade and retention
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function OneFile($dir,$pattern) {
            $files=@(Get-ChildItem -LiteralPath $dir -Filter $pattern -File)
            if($files.Count -ne 1){throw 'Expected exactly one input file'}
            return $files[0].FullName
          }
          $root=Join-Path $env:RUNNER_TEMP 'upgrade'
          $baseline=OneFile (Join-Path $root 'baseline') '*.exe'
          $baselineEvidence=OneFile (Join-Path $root 'baseline-evidence') 'release-evidence.json'
          $candidate=OneFile (Join-Path $root 'candidate') '*.exe'
          $candidateEvidence=OneFile (Join-Path $root 'candidate-evidence') 'release-evidence.json'
          node tools/windows-clean-install-evidence.js verify-build --installer $baseline --evidence $baselineEvidence --commit 0ac746245f7de38ee79e41b05b7b96f85f4c457f --run-id 43921502417
          if($LASTEXITCODE -ne 0){throw 'Baseline provenance failed'}
          node tools/windows-clean-install-evidence.js verify-build --installer $candidate --evidence $candidateEvidence --commit 9d5327ab24dd672728c63a3a6687184b00325c0b --run-id 44904533507
          if($LASTEXITCODE -ne 0){throw 'Candidate provenance failed'}
          & ./tools/run-windows-clean-install-acceptance.ps1 -BaselineInstaller $baseline -BaselineEvidence $baselineEvidence -CandidateInstaller $candidate -CandidateEvidence $candidateEvidence -OutputDirectory (Join-Path $root 'output') -ExpectedCandidateVersion '5.8.0'
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-zip-synthetic-upgrade-evidence
          path: |
            ${{ runner.temp }}/upgrade/output/measurement.json
            ${{ runner.temp }}/upgrade/output/diagnostic.log
          if-no-files-found: warn
          retention-days: 30
