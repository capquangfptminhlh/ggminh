name: Camoufox Windows upstream smoke (no redistribution)

on:
  push:
    branches:
      - feat/per-profile-engine-factory-20261021
      - feat/camoufox-secure-installer-diagnostics-20261021
    paths:
      - .github/workflows/camoufox-upstream-smoke.yml
      - tools/stage-camoufox-upstream-smoke.ps1
      - tools/test-camoufox-real.mjs
      - tools/test-camoufox-native-windows.js
      - tools/test-camoufox-direct-playwright.mjs
      - tools/test-camoufox-electron-main.js
      - tools/test-camoufox-synthetic-auth-proxy.js
      - tools/test-camoufox-playwright-controller-windows.js
      - src/engine/CamoufoxPlaywrightController.js
      - src/engine/camoufoxAdapter.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-camoufox-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-windows-camoufox:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up compatible Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript launcher (test runner only)
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Install app dependencies failed' }
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund camoufox@0.5.8 playwright-core@1.62.0
          if ($LASTEXITCODE -ne 0) { throw 'Install pinned test-only Camoufox launcher failed' }
      - name: Download official pinned Windows x64 release and verify it
        shell: pwsh
        run: |
          ./tools/stage-camoufox-upstream-smoke.ps1
      - name: Launch real Camoufox and test two isolated persistent profiles
        shell: pwsh
        run: |
          node tools/test-camoufox-real.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Real Camoufox smoke failed' }
      - name: Switch to packaged Electron-compatible Node.js 20 for native smoke
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Launch real Camoufox as a native Windows GUI without TypeScript wrapper
        shell: pwsh
        run: |
          node tools/test-camoufox-native-windows.js
          if ($LASTEXITCODE -ne 0) { throw 'Native Win32 Camoufox launch smoke failed' }
      - name: Probe direct playwright-core Firefox persistent context (Node 20, upstream only)
        shell: pwsh
        run: |
          node tools/test-camoufox-direct-playwright.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Direct Playwright/Camoufox compatibility NOT established' }
      - name: Test LHM gated Playwright controller against the real official Windows browser
        shell: pwsh
        run: |
          node tools/test-camoufox-playwright-controller-windows.js
          if ($LASTEXITCODE -ne 0) { throw 'In-process Playwright controller compatibility not verified' }
      - name: Probe Camoufox Playwright inside real Electron 33 main process
        shell: pwsh
        timeout-minutes: 8
        run: |
          if (-not (Test-Path ".\\node_modules\\.bin\\electron.cmd")) {
            throw 'Electron 33 runtime is missing from the test checkout'
          }
          & ".\\node_modules\\.bin\\electron.cmd" ".\\tools\\test-camoufox-electron-main.js"
          if ($LASTEXITCODE -ne 0) { throw 'Electron 33 main-process Playwright compatibility failed' }
      - name: Test real Camoufox to synthetic authenticated SOCKS5 proxy (CONNECT refused)
        shell: pwsh
        timeout-minutes: 8
        run: |
          node tools/test-camoufox-synthetic-auth-proxy.js
          if ($LASTEXITCODE -ne 0) {
            throw 'Real Camoufox SOCKS5 auth gateway fail-closed integration failed'
          }
      - name: Verify no upstream browser binary entered the shipping source tree
        shell: pwsh
        run: |
          $source='./resources/camoufox-engine'
          $files=@(Get-ChildItem -LiteralPath $source -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'README.md') {
            throw 'Unreviewed Camoufox browser resource entered the product staging directory'
          }
          if (Test-Path './dist/win-unpacked/resources/lhm-camoufox/camoufox.exe') {
            throw 'Upstream CI browser unexpectedly included in installed application'
          }
          Write-Host 'Verified: no Camoufox binary was committed or packaged by the smoke test.'
