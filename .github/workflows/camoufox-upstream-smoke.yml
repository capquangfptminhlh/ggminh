name: Pinned Camoufox packaged synthetic acceptance (no release)
on:
  workflow_dispatch:
    inputs:
      source_only:
        description: Reconstruct source only, without downloading an engine
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  packaged-pinned-local:
    if: ${{ !inputs.source_only }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download exact app installer
        uses: actions/download-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          run-id: '44904533507'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lhm-pinned-installer
      - name: Download exact build evidence
        uses: actions/download-artifact@v4
        with:
          name: LHM-Release-Evidence-Windows
          run-id: '44904533507'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lhm-pinned-evidence
      - name: Download engine test artifact
        uses: actions/download-artifact@v4
        with:
          name: camoufox-156.0.1-beta.36-win.x86_64-lhm-lsflush-UNVERIFIED
          run-id: '44736873136'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lhm-pinned-source
      - name: Verify artifacts and install into runner temp
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=@(Get-ChildItem "$env:RUNNER_TEMP/lhm-pinned-installer" -Filter '*.exe' -File)
          $evidence=@(Get-ChildItem "$env:RUNNER_TEMP/lhm-pinned-evidence" -Filter 'release-evidence.json' -File)
          $zip=@(Get-ChildItem "$env:RUNNER_TEMP/lhm-pinned-source" -Filter '*.zip' -File)
          if($installer.Count -ne 1 -or $evidence.Count -ne 1 -or $zip.Count -ne 1){throw 'Expected exactly one file per artifact'}
          node tools/windows-clean-install-evidence.js verify-build --installer $installer[0].FullName --evidence $evidence[0].FullName --commit 9d5327ab24dd672728c63a3a6687184b00325c0b --run-id 44904533507
          if($LASTEXITCODE -ne 0){throw 'Installer provenance failed'}
          if((Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c0837412fa7c1943c21806d9949994384603be7bf07a6630375190171d23eeee'){throw 'Engine archive digest mismatch'}
          $install=Join-Path $env:RUNNER_TEMP 'lhm-pinned-app'
          $p=Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S',('/D='+$install)) -PassThru -Wait -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw 'Synthetic installation failed'}
          "LHM_PACKAGED_EXE=$install\LHM Ads Browser.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LHM_PINNED_ENGINE=$($zip[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise import, create, open and reopen after app restart
        shell: pwsh
        run: |
          node tools/test-pinned-packaged-ui.js
          if($LASTEXITCODE -ne 0){throw 'Packaged synthetic Camoufox acceptance failed'}
  synthetic-upgrade:
    if: ${{ !inputs.source_only }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download baseline installer
        uses: actions/download-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          run-id: '43921502417'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/upgrade/baseline
      - name: Download baseline evidence
        uses: actions/download-artifact@v4
        with:
          name: LHM-Release-Evidence-Windows
          run-id: '43921502417'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/upgrade/baseline-evidence
      - name: Download candidate installer
        uses: actions/download-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          run-id: '44904533507'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/upgrade/candidate
      - name: Download candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: LHM-Release-Evidence-Windows
          run-id: '44904533507'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/upgrade/candidate-evidence
      - name: Verify inputs and exercise synthetic upgrade and retention
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function OneFile($dir,$pattern) {
            $files=@(Get-ChildItem -LiteralPath $dir -Filter $pattern -File)
            if($files.Count -ne 1){throw 'Expected exactly one input file'}
            return $files[0].FullName
          }
          $root=Join-Path $env:RUNNER_TEMP 'upgrade'
          $baseline=OneFile (Join-Path $root 'baseline') '*.exe'
          $baselineEvidence=OneFile (Join-Path $root 'baseline-evidence') 'release-evidence.json'
          $candidate=OneFile (Join-Path $root 'candidate') '*.exe'
          $candidateEvidence=OneFile (Join-Path $root 'candidate-evidence') 'release-evidence.json'
          node tools/windows-clean-install-evidence.js verify-build --installer $baseline --evidence $baselineEvidence --commit 0ac746245f7de38ee79e41b05b7b96f85f4c457f --run-id 43921502417
          if($LASTEXITCODE -ne 0){throw 'Baseline provenance failed'}
          node tools/windows-clean-install-evidence.js verify-build --installer $candidate --evidence $candidateEvidence --commit 9d5327ab24dd672728c63a3a6687184b00325c0b --run-id 44904533507
          if($LASTEXITCODE -ne 0){throw 'Candidate provenance failed'}
          & ./tools/run-windows-clean-install-acceptance.ps1 -BaselineInstaller $baseline -BaselineEvidence $baselineEvidence -CandidateInstaller $candidate -CandidateEvidence $candidateEvidence -OutputDirectory (Join-Path $root 'output') -ExpectedCandidateVersion '5.8.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify browser profile data survives packaged upgrade
        shell: pwsh
        run: |
          $env:LHM_BASELINE_INSTALLER=(Get-ChildItem "$env:RUNNER_TEMP/upgrade/baseline" -Filter '*.exe' -File).FullName
          $env:LHM_CANDIDATE_INSTALLER=(Get-ChildItem "$env:RUNNER_TEMP/upgrade/candidate" -Filter '*.exe' -File).FullName
          node tools/test-packaged-profile-upgrade.js
          if($LASTEXITCODE -ne 0){throw 'Packaged synthetic profile upgrade failed'}
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-zip-synthetic-upgrade-evidence
          path: |
            ${{ runner.temp }}/upgrade/output/measurement.json
            ${{ runner.temp }}/upgrade/output/diagnostic.log
          if-no-files-found: warn
          retention-days: 30
  synthetic-storage-isolation:
    if: ${{ !inputs.source_only }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, gecko]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d5327ab24dd672728c63a3a6687184b00325c0b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure synthetic profile storage isolation only
        shell: pwsh
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:ENGINE -eq 'gecko') {
            $choices=@('C:\Program Files\Mozilla Firefox\firefox.exe','C:\Program Files (x86)\Mozilla Firefox\firefox.exe')
          } else {
            $choices=@('C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe')
          }
          $browser=@($choices | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf} | Select-Object -First 1)
          if($browser.Count -ne 1){throw 'Required test browser missing'}
          $output=Join-Path $env:RUNNER_TEMP ('storage-only-'+$env:ENGINE)
          node tools/concurrent-storage-isolation.js $output $browser[0] $env:ENGINE
          if($LASTEXITCODE -ne 0){throw 'Synthetic storage isolation failed'}
          $report=Get-Content -Raw -LiteralPath (Join-Path $output 'storage-isolation-report.json') | ConvertFrom-Json
          if($report.verdict -ne 'PASS'){throw 'Storage verdict not PASS'}
      - name: Upload synthetic storage reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-only-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/storage-only-${{ matrix.engine }}/storage-isolation-report.json
            ${{ runner.temp }}/storage-only-${{ matrix.engine }}/storage-isolation-cleanup.json
          if-no-files-found: warn
          retention-days: 30
  source-reconstruction:
    if: ${{ inputs.source_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d5327ab24dd672728c63a3a6687184b00325c0b
          path: lhm
      - uses: actions/checkout@v4
        with:
          repository: daijro/camoufox
          ref: 7a4ac0d4dca2dfdeb277f521824a26efb0b6a7b6
          path: camoufox
      - name: Reconstruct changed files from exact Firefox source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C camoufox rev-parse HEAD)" = 7a4ac0d4dca2dfdeb277f521824a26efb0b6a7b6
          patch="$GITHUB_WORKSPACE/lhm/tools/camoufox-engine/patches/zz-lhm-localstorage-flush.patch"
          echo "3bb13fa640f0d94ef0aa5ce1e844ea8e50fad81199fb21f7db0bcea464247c0e  $patch" | sha256sum -c -
          if git -C camoufox grep -I -i -n -E 'ActorsParent\.cpp|StaticPrefList\.yaml' -- patches additions settings; then
            echo 'Unexpected upstream source reference; manual review required' >&2; exit 1
          fi
          if git -C camoufox ls-tree -r --name-only HEAD -- patches additions settings | grep -Ei '(^|/)(ActorsParent\.cpp|StaticPrefList\.yaml)$'; then
            echo 'Unexpected upstream source file; manual review required' >&2; exit 1
          fi
          archive="$RUNNER_TEMP/firefox-156.0.1.source.tar.xz"
          curl --fail --location --retry 3 --output "$archive" https://archive.mozilla.org/pub/firefox/releases/156.0.1/source/firefox-156.0.1.source.tar.xz
          echo "f8b0bf733efebebf9af98ead537598c2cf56c2c1b9c06bf89220ea6731b64724  $archive" | sha256sum -c -
          out="$RUNNER_TEMP/source-reconstruction"
          mkdir -p "$out/dom/localstorage" "$out/modules/libpref/init"
          tar -xJOf "$archive" --wildcards '*/dom/localstorage/ActorsParent.cpp' > "$out/dom/localstorage/ActorsParent.cpp"
          tar -xJOf "$archive" --wildcards '*/modules/libpref/init/StaticPrefList.yaml' > "$out/modules/libpref/init/StaticPrefList.yaml"
          git -C "$out" apply --check "$patch"
          git -C "$out" apply "$patch"
          git -C "$out" apply --reverse --check "$patch"
          cd "$out"
          printf '%s\n' 'a17789e3c9ffa237f2412976a2fdebf8907fb818bac060575619b5c4206a1586  dom/localstorage/ActorsParent.cpp' '1436a88a6314947024962f72c5b3f5e75dc6545501caa2f4d0da49f0dbc61d25  modules/libpref/init/StaticPrefList.yaml' | sha256sum -c -
          cp "$patch" ./zz-lhm-localstorage-flush.patch
          printf '%s\n' 'Reconstruction from Firefox source archive and pinned LHM patch. The original 44736873136 build did not preserve hashes for these two files; this is not a byte comparison with its original workspace.' > RECONSTRUCTION.txt
      - name: Upload source reconstruction evidence
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-source-reconstruction-only
          path: ${{ runner.temp }}/source-reconstruction/
          if-no-files-found: error
          retention-days: 30
