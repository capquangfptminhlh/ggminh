name: Build Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify build provenance and release evidence tools
        run: |
          node test/write-build-info.js
          node test/release-evidence.js
      - name: Write immutable build provenance
        run: node tools/write-build-info.js
      - name: Run verification tests
        run: npm test
      - name: Measure synthetic local profile scale (not browser launch)
        run: node tools/profile-scale-benchmark.js --sizes 100,500,1000 --iterations 12 --output benchmarks/synthetic-profile-scale.json
      - name: Upload measurable performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Metadata-Performance-Windows
          path: benchmarks/synthetic-profile-scale.json
          if-no-files-found: error
          retention-days: 30
      - name: Windows Win32 helper smoke test
        shell: pwsh
        run: |
          # Exercise the actual script in a real Windows runner without touching a browser.
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\src\ops\windowControl.ps1" -Mode focus -Pids "$PID"
          if ($LASTEXITCODE -ne 0) { throw "Window manager helper failed to execute" }
          $result = $output | ConvertFrom-Json
          if ($result.mode -ne 'focus' -or @($result.results).Count -ne 1) {
            throw "Window manager helper produced invalid response"
          }
      - name: Smoke real Chrome or Edge profile and active tab
        run: node test/real-chromium-smoke.js
      - name: Build Windows installer
        run: npm run build:win
      - name: Verify packaged build provenance
        shell: pwsh
        run: |
          $asarPath = Join-Path $PWD 'dist\win-unpacked\resources\app.asar'
          if (-not (Test-Path -LiteralPath $asarPath)) {
            throw 'Packaged app.asar is missing'
          }
          node -e "const asar=require('@electron/asar'); const raw=asar.extractFile(process.argv[1], 'build-info.json'); const info=JSON.parse(raw.toString('utf8')); if(!/^[0-9a-f]{40}$/.test(info.commit)) throw Error('Packaged build-info commit is not a full SHA'); if(info.commit!==process.env.GITHUB_SHA.toLowerCase()) throw Error('Packaged build-info commit does not match checkout'); if(info.schema!=='lhm.build-info.v1') throw Error('Unexpected packaged build-info schema'); console.log(JSON.stringify({packagedCommit:info.commit,appVersion:info.appVersion}));" "$asarPath"
      - name: Verify packaged Win32 helper is unpacked
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\win-unpacked\resources\app.asar.unpacked\src\ops\windowControl.ps1")) {
            throw "PowerShell helper missing from Electron unpacked bundle"
          }
      - name: Verify external bundled engine staging
        shell: pwsh
        run: |
          $resources = ".\\dist\\win-unpacked\\resources\\lhm-engines"
          if (-not (Test-Path (Join-Path $resources "README.md"))) {
            throw "External bundled browser resources missing from packaged installer"
          }
          if (Test-Path ".\\dist\\win-unpacked\\resources\\app.asar.unpacked\\resources\\bundled-engines") {
            throw "Bundled engine resources unexpectedly duplicated inside app bundle"
          }
          if (-not (Test-Path ".\\dist\\win-unpacked\\resources\\lhm-camoufox\\README.md")) {
            throw "Camoufox external release staging directory missing"
          }
          if (Test-Path ".\\dist\\win-unpacked\\resources\\app.asar.unpacked\\resources\\camoufox-engine") {
            throw "Camoufox resource folder was packed inside app bundle unexpectedly"
          }
          $extractor = Join-Path $PWD "dist/win-unpacked/resources/app.asar.unpacked/tools/extract-signed-engine.ps1"
          if (-not (Test-Path $extractor)) {
            throw "Signed extraction helper missing from unpacked Electron resources"
          }
          $camoufoxStaging = Join-Path $PWD "dist/win-unpacked/resources/lhm-camoufox"
          foreach ($unsafe in @("camoufox.exe", "release.json", "publisher-ed25519.pub")) {
            if (Test-Path (Join-Path $camoufoxStaging $unsafe)) {
              throw "Draft preview unexpectedly contains unapproved Camoufox commercial asset: $unsafe"
            }
          }
          node -e "const m=require('./src/engine/bundledEngineManager'); if(typeof m.BundledEngineManager!=='function')process.exit(1)"
      - name: Capture actual Electron UI (sample data)
        shell: pwsh
        env:
          LHM_CI_UI_CAPTURE: '1'
        run: |
          $proc = Start-Process -FilePath ".\node_modules\electron\dist\electron.exe" -ArgumentList "." -PassThru
          try {
            if (-not $proc.WaitForExit(45000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Electron UI capture timed out"
            }
            if ($proc.ExitCode -ne 0) { throw "Electron UI capture exited $($proc.ExitCode)" }
            foreach ($screen in @("workspace-preview.png", "workspace-expanded-preview.png", "workspace-command-preview.png", "workspace-engine-provider-preview.png", "workspace-ads-guard-preview.png", "workspace-performance-lab-preview.png", "workspace-about-update-preview.png", "workspace-customer-handoff-preview.png", "workspace-license-preview.png", "workspace-fleet-triage-preview.png", "workspace-agency-handoff-preview.png", "workspace-profile-paging-preview.png")) {
              $file = Get-Item ("dist\" + $screen) -ErrorAction Stop
              if ($file.Length -lt 10000) { throw "Missing/undersized actual Electron screenshot: $screen" }
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Capture packaged Electron UI
        shell: pwsh
        env:
          LHM_CI_UI_CAPTURE: '1'
        run: |
          $capture = Join-Path $PWD 'dist\packaged-ui'
          New-Item -ItemType Directory -Force -Path $capture | Out-Null
          $env:LHM_CI_UI_CAPTURE_DIR = $capture
          $proc = Start-Process -FilePath ".\dist\win-unpacked\LHM Ads Browser.exe" -PassThru
          try {
            if (-not $proc.WaitForExit(45000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged Electron UI capture timed out"
            }
            if ($proc.ExitCode -ne 0) { throw "Packaged Electron UI capture exited $($proc.ExitCode)" }
            foreach ($screen in @("workspace-preview.png", "workspace-expanded-preview.png", "workspace-command-preview.png", "workspace-engine-provider-preview.png", "workspace-ads-guard-preview.png", "workspace-performance-lab-preview.png", "workspace-about-update-preview.png", "workspace-customer-handoff-preview.png", "workspace-license-preview.png", "workspace-fleet-triage-preview.png", "workspace-agency-handoff-preview.png", "workspace-profile-paging-preview.png")) {
              $file = Get-Item (Join-Path $capture $screen) -ErrorAction Stop
              if ($file.Length -lt 10000) { throw "Missing/undersized packaged Electron screenshot: $screen" }
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Generate and verify release evidence
        shell: pwsh
        env:
          LHM_TEST_STATUS: PASS
          LHM_CHROMIUM_SMOKE_STATUS: PASS
          LHM_PACKAGED_UI_STATUS: PASS
        run: |
          $installers = @(Get-ChildItem -LiteralPath '.\dist' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found $($installers.Count)"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          $env:LHM_AUTHENTICODE_STATUS = $signature.Status.ToString()
          node tools/release-evidence.js --installer $installers[0].FullName --build-info '.\build-info.json' --output '.\dist\release-evidence.json'
          if ($LASTEXITCODE -ne 0) { throw 'Release evidence generation failed' }
          node tools/release-evidence.js --verify --installer $installers[0].FullName --build-info '.\build-info.json' --evidence '.\dist\release-evidence.json'
          if ($LASTEXITCODE -ne 0) { throw 'Release evidence verification failed' }
      - name: Upload actual Electron UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Workspace-UI-Preview
          path: |
            dist/workspace-*.png
            dist/packaged-ui/*.png
          if-no-files-found: ignore
          retention-days: 90
      - name: Record installer SHA-256 and twelve real UI checks
        run: node tools/ci-release-evidence.js dist dist/release-evidence.json
      - name: Upload commercial preflight build evidence
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Release-Evidence-Windows
          path: dist/release-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          path: |
            dist/*.exe
            dist/release-evidence.json
            build-info.json
          if-no-files-found: error
          retention-days: 90
