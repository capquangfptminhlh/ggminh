name: Build Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run verification tests
        run: npm test
      - name: Build Windows installer
        run: npm run build:win
      - name: Capture actual Electron UI (sample data)
        continue-on-error: true
        shell: pwsh
        env:
          LHM_CI_UI_CAPTURE: '1'
        run: |
          $proc = Start-Process -FilePath ".\node_modules\electron\dist\electron.exe" -ArgumentList "." -PassThru
          try {
            if (-not $proc.WaitForExit(45000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Electron UI capture timed out"
            }
            if (-not (Test-Path "dist\workspace-preview.png")) {
              throw "The Windows runner did not produce the screenshot"
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Upload actual Electron UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Workspace-UI-Preview
          path: dist/workspace-preview.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
