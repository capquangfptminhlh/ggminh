name: Build Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run verification tests
        run: npm test
      - name: Build Windows installer
        run: npm run build:win
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
