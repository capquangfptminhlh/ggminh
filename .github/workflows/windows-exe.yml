name: Build Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run verification tests
        run: npm test
      - name: Windows Win32 helper smoke test
        shell: pwsh
        run: |
          # Exercise the actual script in a real Windows runner without touching a browser.
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\src\ops\windowControl.ps1" -Mode focus -Pids "$PID"
          if ($LASTEXITCODE -ne 0) { throw "Window manager helper failed to execute" }
          $result = $output | ConvertFrom-Json
          if ($result.mode -ne 'focus' -or @($result.results).Count -ne 1) {
            throw "Window manager helper produced invalid response"
          }
      - name: Smoke real Chrome or Edge profile and active tab
        run: node test/real-chromium-smoke.js
      - name: Real two-Chromium Synchronizer smoke test
        run: node test/real-navigation-sync-smoke.js
      - name: Build Windows installer
        run: npm run build:win
      - name: Verify packaged Win32 helper is unpacked
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\win-unpacked\resources\app.asar.unpacked\src\ops\windowControl.ps1")) {
            throw "PowerShell helper missing from Electron unpacked bundle"
          }
      - name: Verify external bundled engine staging
        shell: pwsh
        run: |
          $resources = ".\\dist\\win-unpacked\\resources\\lhm-engines"
          if (-not (Test-Path (Join-Path $resources "README.md"))) {
            throw "External bundled browser resources missing from packaged installer"
          }
          if (Test-Path ".\\dist\\win-unpacked\\resources\\app.asar.unpacked\\resources\\bundled-engines") {
            throw "Bundled engine resources unexpectedly duplicated inside app bundle"
          }
          node -e "const m=require('./src/engine/bundledEngineManager'); if(typeof m.BundledEngineManager!=='function')process.exit(1)"
      - name: Package standalone Cloud API (no customer secrets)
        shell: pwsh
        run: |
          $root = 'dist/cloud-service'
          foreach ($dir in @("$root", "$root/src", "$root/src/sync", "$root/src/team", "$root/tools", "$root/docs")) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }
          Copy-Item package.json,package-lock.json -Destination $root
          Copy-Item tools/cloud-server.js -Destination "$root/tools"
          foreach ($file in @('cloudService.js','encryptedMetadata.js','deviceRegistry.js','serverLock.js')) {
            Copy-Item ("src/sync/" + $file) -Destination "$root/src/sync"
          }
          Copy-Item src/team/policy.js -Destination "$root/src/team"
          Copy-Item docs/CLOUD_SERVICE_MVP.md -Destination "$root/docs"
          Push-Location $root
          try {
            npm ci --omit=dev
            if ($LASTEXITCODE -ne 0) { throw "Production Cloud dependencies failed to install" }
            node -e "require('./src/sync/cloudService');require('./src/sync/serverLock');console.log('Cloud server smoke OK')"
            if ($LASTEXITCODE -ne 0) { throw "Cloud server module smoke failed" }
          } finally { Pop-Location }
          Remove-Item -Path "$root/node_modules" -Recurse -Force
          Compress-Archive -Path "$root/*" -DestinationPath "dist/LHM-Cloud-Service-v5.8.0.zip"
      - name: Upload Cloud Service package
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Cloud-Service-v5.8.0
          path: dist/LHM-Cloud-Service-v5.8.0.zip
          if-no-files-found: error
          retention-days: 14
      - name: Capture actual Electron UI (sample data)
        shell: pwsh
        env:
          LHM_CI_UI_CAPTURE: '1'
        run: |
          $proc = Start-Process -FilePath ".\node_modules\electron\dist\electron.exe" -ArgumentList "." -PassThru
          try {
            if (-not $proc.WaitForExit(45000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Electron UI capture timed out"
            }
            foreach ($screen in @("workspace-preview.png", "workspace-expanded-preview.png", "workspace-command-preview.png", "workspace-cloud-sync-preview.png", "workspace-synchronizer-preview.png")) {
              if (-not (Test-Path ("dist\" + $screen))) { throw "Missing actual Electron screenshot: $screen" }
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Upload actual Electron UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Workspace-UI-Preview
          path: dist/workspace-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
