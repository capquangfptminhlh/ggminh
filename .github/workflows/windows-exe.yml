name: Build Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # QA-006: the test suite must also pass on a POSIX host, so path-semantics
  # regressions in fixtures or product code are caught on every PR.
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run verification tests
        run: npm test
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Electron 42+ no longer downloads its binary in postinstall; the UI
      # capture step below runs node_modules\electron\dist\electron.exe.
      - name: Install Electron runtime binary
        run: npx install-electron --no
      - name: Run verification tests
        run: npm test
      - name: Verify vendor-pinned license endpoint and safe Preview defaults
        run: node test/license-packaged-authority.js
      - name: Gate 3 exact-build operator packet regression (synthetic EXE only)
        run: node test/gate3-operator-kit.js
      - name: Gate 3 Windows integrity collector regression (synthetic EXE only)
        shell: pwsh
        run: |
          & "./test/windows-gate3-preflight.ps1"
      - name: Measure synthetic local profile scale (not browser launch)
        run: node tools/profile-scale-benchmark.js --sizes 100,500,1000 --iterations 12 --output benchmarks/synthetic-profile-scale.json
      - name: Upload measurable performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Metadata-Performance-Windows
          path: benchmarks/synthetic-profile-scale.json
          if-no-files-found: error
          retention-days: 30
      - name: Windows Win32 helper smoke test
        shell: pwsh
        run: |
          # Exercise the actual script in a real Windows runner without touching a browser.
          $output = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\src\ops\windowControl.ps1" -Mode focus -Pids "$PID"
          if ($LASTEXITCODE -ne 0) { throw "Window manager helper failed to execute" }
          $result = $output | ConvertFrom-Json
          if ($result.mode -ne 'focus' -or @($result.results).Count -ne 1) {
            throw "Window manager helper produced invalid response"
          }
      - name: Smoke real Chrome or Edge profile and active tab
        run: node test/real-chromium-smoke.js
      - name: Build Windows installer
        env:
          # Optional Authenticode signing (Constitution v1.4: not required).
          # With repo secrets WIN_CSC_LINK (base64 .pfx) and
          # WIN_CSC_KEY_PASSWORD set, electron-builder signs the app EXE and
          # the installer; without them (or on fork PRs) the build is unsigned.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:win
      - name: Check Authenticode status
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          $files = @(Get-Item ".\dist\win-unpacked\LHM Ads Browser.exe") + @(Get-ChildItem ".\dist\*.exe")
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Host ("{0}: {1} {2}" -f $file.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($env:SIGNING_CONFIGURED -eq 'true' -and $sig.Status -ne 'Valid') {
              throw "Signing is configured but $($file.Name) is not validly signed ($($sig.Status))"
            }
          }
          if ($env:SIGNING_CONFIGURED -ne 'true') {
            Write-Host 'Unsigned build: allowed by Constitution v1.4; Windows SmartScreen will warn on install.'
          }
      - name: Verify packaged Win32 helper is unpacked
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\win-unpacked\resources\app.asar.unpacked\src\ops\windowControl.ps1")) {
            throw "PowerShell helper missing from Electron unpacked bundle"
          }
      - name: Validate packaged runtime and exclude unapproved engine payloads
        shell: pwsh
        run: |
          $resources = Join-Path $PWD "dist\\win-unpacked\\resources"
          $unpacked = Join-Path $resources "app.asar.unpacked"
          foreach ($required in @(
            "src\\ops\\windowControl.ps1",
            "tools\\extract-signed-engine.ps1"
          )) {
            if (-not (Test-Path (Join-Path $unpacked $required) -PathType Leaf)) {
              throw "Required unpacked runtime helper missing: $required"
            }
          }
          if (-not (Test-Path (Join-Path $resources "lhm-update-publisher\\update-publisher-ed25519.pub") -PathType Leaf)) {
            throw "Update trust anchor missing from packaged resources"
          }
          # The installer may carry only the verified public trust anchor and
          # signed download descriptor. The 1.3 GB engine, its manifest and
          # every private key remain outside the application package.
          $sourceCamoufox = Join-Path $PWD "resources\camoufox-engine"
          $packagedCamoufox = Join-Path $resources "lhm-camoufox"
          node tools/verify-camoufox-release-resources.js $sourceCamoufox
          if ($LASTEXITCODE -ne 0) { throw 'Source Camoufox release metadata failed verification' }
          node tools/verify-camoufox-release-resources.js $packagedCamoufox
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Camoufox release metadata failed verification' }
          $bundled = Join-Path $resources "lhm-engines"
          if (Test-Path $bundled) {
            $forbidden = Get-ChildItem $bundled -Recurse -File -ErrorAction Stop |
              Where-Object { $_.Name -in @("camoufox.exe", "manifest.json") }
            if ($forbidden) {
              throw "Unapproved engine payload staged in lhm-engines: $($forbidden.FullName -join ', ')"
            }
          }
      - name: Verify packaged license authority is explicitly DISABLED in Preview
        shell: pwsh
        run: |
          $file = ".\\dist\\win-unpacked\\resources\\lhm-license-authority\\authority.json"
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
            throw 'Packaged license authority config missing from Windows installer'
          }
          $raw = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          if ($raw.schema -ne 'lhm.license-authority-config.v1' -or
              $raw.enabled -ne $false -or $null -ne $raw.endpoint) {
            throw 'Preview installer must NOT ship a live license authority before production approval'
          }
      - name: Capture actual Electron UI (sample data)
        shell: pwsh
        env:
          LHM_CI_UI_CAPTURE: '1'
        run: |
          $proc = Start-Process -FilePath ".\node_modules\electron\dist\electron.exe" -ArgumentList "." -PassThru
          try {
            if (-not $proc.WaitForExit(45000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Electron UI capture timed out"
            }
            if ($proc.ExitCode -ne 0) { throw "Electron UI capture exited $($proc.ExitCode)" }
            foreach ($screen in @("workspace-preview.png", "workspace-expanded-preview.png", "workspace-command-preview.png", "workspace-engine-provider-preview.png", "workspace-ads-guard-preview.png", "workspace-performance-lab-preview.png", "workspace-about-update-preview.png", "workspace-customer-handoff-preview.png", "workspace-license-preview.png", "workspace-fleet-triage-preview.png", "workspace-agency-handoff-preview.png", "workspace-profile-paging-preview.png")) {
              $file = Get-Item ("dist\" + $screen) -ErrorAction Stop
              if ($file.Length -lt 10000) { throw "Missing/undersized actual Electron screenshot: $screen" }
            }
            $editor = Get-Item "dist\\workspace-profile-editor-preview.png" -ErrorAction Stop
            if ($editor.Length -lt 10000) { throw "Missing profile editor visual smoke" }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Capture packaged Electron UI
        shell: pwsh
        env:
          LHM_CI_UI_CAPTURE: '1'
        run: |
          $capture = Join-Path $PWD 'dist\packaged-ui'
          New-Item -ItemType Directory -Force -Path $capture | Out-Null
          $env:LHM_CI_UI_CAPTURE_DIR = $capture
          $proc = Start-Process -FilePath ".\dist\win-unpacked\LHM Ads Browser.exe" -PassThru
          try {
            if (-not $proc.WaitForExit(45000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged Electron UI capture timed out"
            }
            if ($proc.ExitCode -ne 0) { throw "Packaged Electron UI capture exited $($proc.ExitCode)" }
            foreach ($screen in @("workspace-preview.png", "workspace-expanded-preview.png", "workspace-command-preview.png", "workspace-engine-provider-preview.png", "workspace-ads-guard-preview.png", "workspace-performance-lab-preview.png", "workspace-about-update-preview.png", "workspace-customer-handoff-preview.png", "workspace-license-preview.png", "workspace-fleet-triage-preview.png", "workspace-agency-handoff-preview.png", "workspace-profile-paging-preview.png")) {
              $file = Get-Item (Join-Path $capture $screen) -ErrorAction Stop
              if ($file.Length -lt 10000) { throw "Missing/undersized packaged Electron screenshot: $screen" }
            }
            $editor = Get-Item (Join-Path $capture "workspace-profile-editor-preview.png") -ErrorAction Stop
            if ($editor.Length -lt 10000) { throw "Missing packaged profile editor visual smoke" }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Upload actual Electron UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Workspace-UI-Preview
          path: |
            dist/workspace-*.png
            dist/packaged-ui/*.png
            dist/ui-layout-debug.json
            dist/packaged-ui/ui-layout-debug.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Record installer SHA-256 and twelve real UI checks
        run: node tools/ci-release-evidence.js dist dist/release-evidence.json
      - name: Generate operator Gate 3 kit from the same EXE SHA and commit
        run: node tools/create-gate3-operator-kit.js dist/release-evidence.json dist dist/gate3-operator-kit
      - name: Upload privacy-minimal Gate 3 operator kit (NO EXE)
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Gate3-Operator-Kit-Windows
          path: dist/gate3-operator-kit/
          if-no-files-found: error
          retention-days: 30
      - name: Upload commercial preflight build evidence
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Release-Evidence-Windows
          path: dist/release-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Ads-Browser-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
