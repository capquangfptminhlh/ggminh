name: Camoufox patched engine build (TEST ONLY, NO release)
# Rebuilds Camoufox v156.0.1-beta.36 for Windows x86_64 from its exact upstream
# commit plus the LHM patches in tools/camoufox-engine/patches, using the same
# steps as upstream's build-browser job (daijro/camoufox .github/workflows/
# release.yml at that commit). Upstream's own Windows x86_64 job for this
# commit ran 2h25m on ubuntu-24.04 (build step 2h14m).
#
# The output is an UNSIGNED, UNVERIFIED test artifact. It is never published as
# a release, never referenced by resources/camoufox-engine/release.json, and
# must not reach customers until it passes the Windows storage checks and a
# separate signing/release decision.
on:
  workflow_dispatch:
  push:
    branches:
      - 'engine-build/**'

permissions:
  contents: read

concurrency:
  group: camoufox-engine-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CAMOUFOX_REPO: daijro/camoufox
  # Commit that tag v156.0.1-beta.36 points to.
  CAMOUFOX_COMMIT: 7a4ac0d4dca2dfdeb277f521824a26efb0b6a7b6
  CAMOUFOX_TAG: v156.0.1-beta.36
  PYTHON_VERSION: "3.12"
  BUILD_TARGET: windows,x86_64

jobs:
  build-windows-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Disk before cleanup
        run: df -h /

      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef # v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null || true
          sudo apt-get remove -y '^dotnet-.*' > /dev/null || true
          sudo apt-get remove -y '^llvm-.*' > /dev/null || true
          sudo apt-get remove -y 'php.*' > /dev/null || true
          sudo apt-get remove -y '^mongodb-.*' > /dev/null || true
          sudo apt-get remove -y '^mysql-.*' > /dev/null || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox mono-devel libgl1-mesa-dri --fix-missing > /dev/null || true
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null

      - name: Require enough free disk before spending build time
        run: |
          df -h /
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free GiB: $avail"
          # source + toolchains + Windows obj dir + fonts + 24G swap file
          if [ "$avail" -lt 70 ]; then echo "::error::only ${avail}G free; need >= 70G"; exit 1; fi

      - name: Check out LHM patches
        uses: actions/checkout@v4
        with:
          path: lhm

      - name: Check out Camoufox at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CAMOUFOX_REPO }}
          ref: ${{ env.CAMOUFOX_COMMIT }}
          path: camoufox

      - name: Verify pinned commit and add LHM patches
        working-directory: camoufox
        run: |
          test "$(git rev-parse HEAD)" = "$CAMOUFOX_COMMIT"
          mkdir -p patches/lhm
          cp -v ../lhm/tools/camoufox-engine/patches/*.patch patches/lhm/
          sha256sum patches/lhm/*.patch | tee ../patches.sha256
          python3 -m ci.release set-build --tag "$CAMOUFOX_TAG"
          grep '^release=' upstream.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools p7zip-full aria2 ccache fontconfig zstd

      - name: Fetch the font bundle
        working-directory: camoufox
        run: make fonts-extract

      - name: Verify the font bundle matches the manifest
        working-directory: camoufox
        run: python3 scripts/verify-fonts.py

      - name: Prepare the source tree (applies all patches, fails on rejects)
        working-directory: camoufox
        run: python3 -m ci.run_prepare

      - name: Prove the LHM patch is in the prepared tree
        working-directory: camoufox
        run: |
          src=$(ls -d camoufox-156.0.1-*/ | head -1)
          grep -n 'FlushTimeoutMs(), nsITimer::TYPE_ONE_SHOT' "$src/dom/localstorage/ActorsParent.cpp"
          grep -n -A3 'name: dom.storage.flush_timeout_ms' "$src/modules/libpref/init/StaticPrefList.yaml"
          if grep -n 'kFlushTimeoutMs, nsITimer' "$src/dom/localstorage/ActorsParent.cpp"; then
            echo "::error::stock 5000 ms timer still in use"; exit 1
          fi

      - name: Snapshot exact corresponding source tree (MPL-2.0)
        run: |
          BUILD_TARGET="$BUILD_TARGET" make -C camoufox set-target
          mkdir -p out-source out/source
          src_dir=$(ls -d camoufox/camoufox-156.0.1-*/ | head -1 | sed 's:/$::')
          src_base=$(basename "$src_dir")
          firefox_sha=$(sha256sum camoufox/firefox-156.0.1.source.tar.xz | awk '{print $1}')
          echo "FIREFOX_TARBALL_SHA256=$firefox_sha" >> "$GITHUB_ENV"

          cp -v lhm/tools/camoufox-engine/patches/*.patch out/source/
          cp -rv camoufox/patches out/source/camoufox-patches
          cp -rv camoufox/additions out/source/camoufox-additions
          cp -rv camoufox/settings out/source/camoufox-settings
          cp -v "$src_dir/mozconfig" out/source/mozconfig
          mkdir -p out/source/modified/dom/localstorage out/source/modified/modules/libpref/init
          cp -v "$src_dir/dom/localstorage/ActorsParent.cpp" out/source/modified/dom/localstorage/
          cp -v "$src_dir/modules/libpref/init/StaticPrefList.yaml" out/source/modified/modules/libpref/init/
          actors_sha=$(sha256sum "$src_dir/dom/localstorage/ActorsParent.cpp" | awk '{print $1}')
          pref_sha=$(sha256sum "$src_dir/modules/libpref/init/StaticPrefList.yaml" | awk '{print $1}')
          echo "ACTORS_PARENT_SHA256=$actors_sha" >> "$GITHUB_ENV"
          echo "STATIC_PREF_SHA256=$pref_sha" >> "$GITHUB_ENV"

          tar -C camoufox -I 'zstd -T0 -6' -cf "out-source/${src_base}-prepared-source.tar.zst" "$src_base"
          prep_sha=$(sha256sum "out-source/${src_base}-prepared-source.tar.zst" | awk '{print $1}')
          echo "PREPARED_SOURCE_SHA256=$prep_sha" >> "$GITHUB_ENV"
          echo "PREPARED_SOURCE_NAME=${src_base}-prepared-source.tar.zst" >> "$GITHUB_ENV"
          (cd out-source && sha256sum "${src_base}-prepared-source.tar.zst" > SHA256SUMS)
          ls -lh out-source/

      - name: Create swap space
        run: |
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Build
        working-directory: camoufox
        env:
          CARGO_BUILD_JOBS: "1"
        run: python3 ./multibuild.py --target windows --arch x86_64

      - name: Package clean 508-font ZIP, unsigned manifest, and distribution notices
        run: |
          rm -rf camoufox/camoufox-156.0.1-*/obj-*
          zip=$(ls camoufox/dist/camoufox-*-win.x86_64.zip | head -1)
          patch_sha=$(awk '{print $1}' patches.sha256 | head -1)
          mkdir -p out/distribution-licenses "$RUNNER_TEMP/meta"
          node -e '
            const fs = require("fs");
            fs.writeFileSync(process.argv[2], JSON.stringify({
              firefox_tarball_sha256: process.env.FIREFOX_TARBALL_SHA256,
              camoufox_commit: process.env.CAMOUFOX_COMMIT,
              camoufox_tag: process.env.CAMOUFOX_TAG,
              lhm_commit: process.env.GITHUB_SHA,
              lhm_patch_sha256: process.argv[1],
              prepared_source_sha256: process.env.PREPARED_SOURCE_SHA256,
              actors_parent_sha256: process.env.ACTORS_PARENT_SHA256,
              static_pref_sha256: process.env.STATIC_PREF_SHA256,
              build_run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }, null, 2));
          ' "$patch_sha" "$RUNNER_TEMP/meta/build-meta.json"

          clean_zip="$PWD/out/camoufox-156.0.1-win.x86_64-lhm-clean508.zip"
          clean_tree="$RUNNER_TEMP/clean508-tree"
          python3 lhm/tools/camoufox-engine/filter-clean508.py \
            --input-zip "$zip" \
            --notices-dir lhm/tools/camoufox-engine/licenses \
            --out-zip "$clean_zip" \
            --out-tree "$clean_tree" \
            --licenses-out "$PWD/out/distribution-licenses" \
            --meta-json "$RUNNER_TEMP/meta/build-meta.json" | tee out/clean508-summary.json

          node lhm/tools/camoufox-engine/unsigned-manifest.js "$clean_tree" 156.0.1 "$PWD/out/clean508-unsigned-manifest.json" | tee out/unsigned-manifest-summary.json
          payload_pin=$(node -p "JSON.parse(require('fs').readFileSync('out/unsigned-manifest-summary.json','utf8')).payloadSha256")
          camoufox_exe_sha=$(node -p "JSON.parse(require('fs').readFileSync('out/unsigned-manifest-summary.json','utf8')).camoufoxExeSha256")
          sed -i "s/PENDING_MANIFEST_GENERATION/$payload_pin/g" out/distribution-licenses/CAMOUFOX-MPL2-NOTICE.md
          if grep -E 'PENDING_|UNSPECIFIED|\{\{' out/distribution-licenses/CAMOUFOX-MPL2-NOTICE.md; then
            echo "::error::Unresolved template placeholder in CAMOUFOX-MPL2-NOTICE.md"; exit 1
          fi

          rm -rf "$clean_tree"
          {
            echo "camoufox_repo=$CAMOUFOX_REPO"
            echo "camoufox_commit=$CAMOUFOX_COMMIT"
            echo "camoufox_tag_base=$CAMOUFOX_TAG"
            echo "lhm_commit=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "firefox_tarball_sha256=$FIREFOX_TARBALL_SHA256"
            echo "prepared_source_name=$PREPARED_SOURCE_NAME"
            echo "prepared_source_sha256=$PREPARED_SOURCE_SHA256"
            echo "actors_parent_sha256=$ACTORS_PARENT_SHA256"
            echo "static_pref_sha256=$STATIC_PREF_SHA256"
            echo "clean508_payload_pin=$payload_pin"
            echo "camoufox_exe_sha256=$camoufox_exe_sha"
            echo "status=UNSIGNED_PINNED_CLEAN508_WITH_CORRESPONDING_SOURCE"
          } > out/BUILD-INFO.txt
          cat patches.sha256 >> out/BUILD-INFO.txt
          (cd out && sha256sum camoufox-156.0.1-win.x86_64-lhm-clean508.zip clean508-unsigned-manifest.json > SHA256SUMS)
          cp out/BUILD-INFO.txt out-source/BUILD-INFO.txt
          cat out/BUILD-INFO.txt

      - name: Upload Clean-508 Engine + Licenses + Source Diff
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-156.0.1-win.x86_64-lhm-clean508
          path: out/*
          retention-days: 90

      - name: Upload Exact Prepared Corresponding Source (MPL-2.0)
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-156.0.1-win.x86_64-lhm-clean508-source
          path: out-source/*
          retention-days: 90
